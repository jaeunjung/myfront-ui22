<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 서울의 혼잡한 장소를 피해 한적한 장소를 찾아 여행 계획을 짜는 사이트">
    <title>장소 탐색 | 틈새</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/modal.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        /* ===== 틈새 (Teumsae) Redesign Theme - Reference Style ===== */
        :root {
            --bg-color: #2C2C2C;
            /* Dark Giwa Charcoal */
            --text-color: #F4F4F0;
            /* Hanji White */
            --accent-color: #D4AF37;
            /* Muted Gold */
            --border-color: rgba(255, 255, 255, 0.1);
            --font-serif: 'Noto Serif KR', serif;
            --font-sans: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        html {
            overflow-y: scroll;
            /* Force scrollbar to prevent layout shift */
        }

        /* Dark Theme Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            border: 3px solid var(--bg-color);
            /* Creates padding effect */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-serif);
            font-weight: 700;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 0;
            /* Adjusted to vertical only, horizontal handled by container */
            display: flex;
            justify-content: center;
            /* Center the container */
            align-items: center;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
            transition: background 0.3s ease;
            width: 100%;
            /* Ensure full width */
        }

        .header.scrolled {
            background: rgba(44, 44, 44, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .header__logo {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .header__logo .logo-teum,
        .header__logo .logo-sae {
            background: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header__logo .logo-gap {
            display: inline-block;
            width: 6px;
            height: 20px;
            margin: 0 3px;
            background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.4) 50%, transparent 100%);
            border-radius: 2px;
            position: relative;
        }

        .header__logo:hover {
            transform: scale(1.02);
        }

        .header__logo:hover .logo-gap {
            background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.7) 50%, transparent 100%);
        }

        .header__nav {
            display: flex;
            gap: 30px;
        }

        .header__link {
            color: rgba(244, 244, 240, 0.8);
            font-size: 16px;
            transition: color 0.3s;
        }

        .header__link:hover {
            color: var(--text-color);
        }

        /* User Menu */
        .user-menu {
            position: relative;
        }

        .user-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: #D4AF37;
            color: #2C2C2C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .user-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: rgba(35, 35, 35, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            min-width: 200px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .user-menu:hover .user-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-dropdown-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .user-dropdown-header .user-email {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .user-dropdown-header .user-greeting {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 600;
        }

        .user-dropdown-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px 0;
        }

        .user-dropdown-item {
            padding: 12px 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        .user-dropdown-item:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent-color);
        }

        .user-dropdown-item svg {
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        .user-dropdown-item:hover svg {
            opacity: 1;
        }

        .user-dropdown-item.logout {
            color: rgba(255, 100, 100, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-dropdown-item.logout:hover {
            background: rgba(255, 100, 100, 0.1);
            color: #ff6b6b;
        }

        /* Hero Section */
        .main__hero {
            position: relative;
            height: 90vh;
            /* Full impactful height */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: url('images/hanok_header_v2.jpg') no-repeat center center / cover;
            margin-bottom: 20px;
        }

        .main__hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            /* Subtle overlay */
            z-index: 1;
        }

        .main__hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to bottom, transparent, var(--bg-color));
            z-index: 1;
        }

        .hero__content {
            position: relative;
            z-index: 2;
        }

        .main__title {
            font-size: 4rem;
            color: var(--text-color);
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .main__title span {
            font-weight: bold;
            background: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .main__title .hero-gap {
            display: inline-block;
            width: 10px;
            height: 50px;
            margin: 0 4px;
            background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.5) 50%, transparent 100%);
            border-radius: 3px;
            vertical-align: middle;
        }

        .main__subtitle {
            font-size: 1.2rem;
            color: rgba(244, 244, 240, 0.9);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Search Box - Minimalist */
        .search-box {
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 0;
            margin-bottom: 50px;
            transition: border-color 0.3s;
            background: transparent;
            /* Override component style */
            position: relative;
            /* For label positioning if needed */
        }

        .search-box:focus-within {
            border-bottom-color: var(--text-color);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 25px;
            margin-bottom: 0;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--text-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .search-box__icon {
            color: rgba(255, 255, 255, 0.7);
            margin-right: 15px;
        }

        .search-box__input {
            background: none;
            border: none;
            outline: none;
            width: 100%;
            font-size: 1.1rem;
            color: var(--text-color);
            font-family: var(--font-serif);
        }

        .search-box__input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .main__filters {
            margin-top: 15px;
            margin-bottom: 0;
        }

        .filter-section {
            margin-bottom: 2px;
        }

        .filter-section__label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: rgba(255, 255, 255, 0.4);
            color: var(--text-color);
        }

        .filter-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(212, 175, 55, 0.1);
        }

        /* Content Area - unified container for filters + places */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Places Grid */
        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding-bottom: 60px;
        }

        .place-card {
            background: #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .place-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .place-card__image {
            height: 200px;
            background: #444;
            overflow: hidden;
        }

        .place-card__image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-card__content {
            padding: 20px;
        }

        .place-card__title {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .place-card__desc {
            font-size: 0.9rem;
            color: rgba(244, 244, 240, 0.6);
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Split View / Map Toggle Logic */
        .split-view-container {
            display: flex;
            gap: 20px;
            position: relative;
        }

        .list-panel {
            width: 100%;
            transition: width 0.3s ease;
        }

        .list-panel.shrunk {
            width: 50%;
        }

        .map-panel {
            display: none;
            width: 50%;
            position: sticky;
            top: 100px;
            height: calc(100vh - 120px);
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }

        .map-panel.active {
            display: block;
        }

        /* Map Toggle Button */
        .map-toggle-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: var(--accent-color);
            /* Gold background */
            color: #2C2C2C;
            /* Dark text */
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s;
        }

        .map-toggle-btn:hover {
            transform: scale(1.05);
        }

        /* Footer */
        .footer {
            background: #111;
            padding: 60px 0;
            margin-top: 60px;
            border-top: 1px solid var(--border-color);
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header__inner">

    </header>

    <main>
        <!-- Hero Section -->
        <section class="main__hero">
            <div class="hero__content reveal">
                <h1 class="main__title">소음 속의 <span>틈</span><span class="hero-gap"></span><span>새</span></h1>

        </section>

        <!-- Main Content -->
        <div class="container">
            <div class="split-view-container">

                        <input type="text" class="search-box__input" placeholder="장소, 분위기, 지역을 검색해보세요 (예: 경복궁, 야경)">

                    <!-- Content Area (Filters + Places) -->

                                    <button class="filter-btn" data-mood="한적한">한적한</button>

                                </div>

                        </div>

                        <!-- Places Grid -->
                        <div class="places-grid" id="places-grid">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Footer inside content panel so it pushes down -->
                    <footer class="footer">
                        <div class="footer__content">
                            <h3>틈새 Teumsae</h3>

    <script>
        // Check login state
        function checkAuth() {
            const user = localStorage.getItem('teumsae_user') || sessionStorage.getItem('teumsae_user');
            if (!user) {
                // Allow guest for now
                return { isGuest: true };
            }
            return JSON.parse(user);
        }

        // Update user info in header
        function updateUserInfo(user) {
            const avatar = document.getElementById('user-avatar');
            const name = document.getElementById('user-name');
            if (!avatar || !name) return;

            if (user.isGuest) {
                avatar.textContent = 'G';
                name.textContent = 'Guest';
            } else {
                const initial = user.email ? user.email.charAt(0).toUpperCase() : 'U';
                avatar.textContent = initial;
                name.textContent = user.name || user.email.split('@')[0];
            }
        }

        function logout() {
            localStorage.removeItem('teumsae_user');
            sessionStorage.removeItem('teumsae_user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', function () {
            const user = checkAuth();
            if (user) {
                updateUserInfo(user);
            }
            // Add scroll listener for header
            const header = document.querySelector('.header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // Re-render place list (app.js should handle this, but if we replaced HTML, app.js might need re-trigger)
            if (typeof renderPlaceList === 'function') renderPlaceList();
        });

        // Toggle Map View Logic
        let isMapOpen = false;
        function toggleMapView() {
            const contentPanel = document.getElementById('content-panel');
            const mapPanel = document.getElementById('map-panel');
            const toggleBtn = document.getElementById('map-toggle-btn');
            const toggleText = document.getElementById('map-toggle-text');
            const toggleIcon = document.getElementById('map-toggle-icon');

            isMapOpen = !isMapOpen;

            if (isMapOpen) {
                contentPanel.classList.add('shrunk');
                mapPanel.classList.add('active');
                toggleBtn.classList.add('active');
                toggleText.textContent = 'List View';
                // Icon change logic
            } else {
                contentPanel.classList.remove('shrunk');
                mapPanel.classList.remove('active');
                toggleBtn.classList.remove('active');
                toggleText.textContent = 'Map View';
            }
        }
    </script>
