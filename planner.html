<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 나만의 여행 일정 만들기">
    <title>여행 계획 | 틈새</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        /* ===== 틈새 (Teumsae) Redesign Theme - Reference Style ===== */
        :root {
            --bg-color: #2C2C2C;
            /* Dark Giwa Charcoal */
            --text-color: #F4F4F0;
            /* Hanji White */
            --accent-color: #D4AF37;
            /* Muted Gold */
            --border-color: rgba(255, 255, 255, 0.1);
            --font-serif: 'Noto Serif KR', serif;
            --font-sans: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        html {
            overflow-y: scroll;
        }

        /* Dark Theme Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            border: 3px solid var(--bg-color);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-serif);
            font-weight: 700;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
            transition: background 0.3s ease;
            width: 100%;
        }

        .header.scrolled {
            background: rgba(44, 44, 44, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .header__logo {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .header__logo .logo-teum,
        .header__logo .logo-sae {
            background: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header__logo .logo-gap {
            display: inline-block;
            width: 6px;
            height: 20px;
            margin: 0 3px;
            background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.4) 50%, transparent 100%);
            border-radius: 2px;
            position: relative;
        }

        .header__logo:hover {
            transform: scale(1.02);
        }

        .header__logo:hover .logo-gap {
            background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.7) 50%, transparent 100%);
        }

        .header__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .header__nav {
            display: flex;
            gap: 30px;
        }

        .header__link {
            color: rgba(244, 244, 240, 0.8);
            font-size: 16px;
            transition: color 0.3s;
        }

        .header__link:hover {
            color: var(--text-color);
        }

        /* User Menu */
        .user-menu {
            position: relative;
        }

        .user-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: #D4AF37;
            color: #2C2C2C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .user-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: rgba(35, 35, 35, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            min-width: 200px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .user-menu:hover .user-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-dropdown-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .user-dropdown-header .user-email {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .user-dropdown-header .user-greeting {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 600;
        }

        .user-dropdown-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px 0;
        }

        .user-dropdown-item {
            padding: 12px 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        .user-dropdown-item:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent-color);
        }

        .user-dropdown-item svg {
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        .user-dropdown-item:hover svg {
            opacity: 1;
        }

        .user-dropdown-item.logout {
            color: rgba(255, 100, 100, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-dropdown-item.logout:hover {
            background: rgba(255, 100, 100, 0.1);
            color: #ff6b6b;
        }

        /* Planner Specific Styles */
        .planner {
            padding-top: 120px;
            min-height: 100vh;
            background-color: transparent;
            /* Fix white background issue */
        }

        .planner__title {
            color: var(--text-color);
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .planner__subtitle {
            color: rgba(244, 244, 240, 0.7);
            font-size: 1.1rem;
        }

        /* Sidebar & Timeline Containers */
        .planner__sidebar,
        .planner__timeline {
            background: #333;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .planner__sidebar-title {
            color: var(--text-color);
            font-family: var(--font-serif);
        }

        /* Items in lists */
        .planner__saved-item,
        .planner__timeline-item {
            background: rgba(255, 255, 255, 0.05);
            /* Matched to recommend.html */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 15px;
            transition: all 0.2s;
        }

        .planner__saved-item:hover,
        .planner__timeline-item:hover {
            background: #505050;
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .planner__item-title {
            font-weight: bold;
            color: var(--text-color);
        }

        .planner__item-category {
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        /* Fixed Visibility for Saved Items */
        .planner__saved-name {
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 2px;
        }

        .planner__saved-category {
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        /* Fixed Visibility for Timeline Items */
        .planner__timeline-info h4 {
            color: var(--text-color);
            margin-bottom: 4px;
            font-size: 1.1rem;
            margin-top: 0;
        }

        .planner__timeline-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0;
        }

        /* Empty States */
        #empty-saved,
        .planner__empty {
            color: rgba(255, 255, 255, 0.4) !important;
        }

        /* Date Picker */
        .planner__date-input {
            background: #444;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Button Overrides for consistency */
        .btn-primary {
            background: var(--accent-color);
            color: #2C2C2C;
            /* Dark text for contrast on gold */
            font-weight: 700;
        }

        .btn-primary:hover {
            background: #E4B584;
            /* lighter gold */
            color: #2C2C2C;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-secondary:hover {
            background: var(--accent-color);
            color: #2C2C2C;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <a href="main.html" class="header__logo"><span class="logo-teum">틈</span><span
                        class="logo-gap"></span><span class="logo-sae">새</span></a>
                <nav class="header__nav">
                    <a href="main.html#places" class="header__link hover-underline">장소 탐색</a>
                    <a href="recommend.html" class="header__link hover-underline">AI 추천</a>
                    <a href="planner.html" class="header__link hover-underline" style="color: var(--accent-color);">여행
                        계획</a>
                </nav>
                <div class="user-menu" id="user-menu">
                    <button class="user-btn">
                        <span class="user-avatar" id="user-avatar">G</span>
                        <span id="user-name">게스트</span>
                    </button>
                    <div class="user-dropdown">
                        <div class="user-dropdown-header">
                            <div class="user-greeting">환영합니다!</div>
                            <div class="user-email" id="user-email">guest@teumsae.kr</div>
                        </div>
                        <a href="planner.html" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            내 여행 계획
                        </a>
                        <a href="#" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                            </svg>
                            저장한 장소
                        </a>
                        <a href="recommend.html" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon
                                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                            </svg>
                            AI 추천받기
                        </a>
                        <div class="user-dropdown-divider"></div>
                        <a href="#" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3" />
                                <path
                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                            </svg>
                            설정
                        </a>
                        <a href="#" class="user-dropdown-item logout" onclick="logout()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            로그아웃
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Planner Page -->
    <main class="planner">
        <div class="container">
            <!-- Header -->
            <div class="planner__header reveal">
                <h1 class="planner__title">나만의 여행 일정</h1>
                <p class="planner__subtitle">저장한 장소들로 특별한 하루를 계획해보세요</p>
            </div>

            <!-- Content -->
            <div class="planner__content">
                <!-- Sidebar - Saved Places -->
                <aside class="planner__sidebar reveal-left">
                    <h2 class="planner__sidebar-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                        저장된 장소
                    </h2>
                    <p style="font-size: 0.875rem; color: var(--color-gray); margin-bottom: 1rem;">
                        장소를 타임라인에 드래그하세요
                    </p>
                    <div class="planner__saved-list" id="saved-list">
                        <!-- Saved places will be rendered here -->
                    </div>
                    <div id="empty-saved"
                        style="display: none; text-align: center; padding: 2rem; color: var(--color-gray);">
                        <p style="font-size: 2rem; margin-bottom: 0.5rem;">📍</p>
                        <p>저장된 장소가 없습니다</p>
                        <a href="main.html" class="btn btn-primary btn-sm" style="margin-top: 1rem;">장소 둘러보기</a>
                    </div>
                </aside>

                <!-- Timeline -->
                <div class="planner__timeline reveal-right">
                    <div class="planner__timeline-header">
                        <h2 class="planner__sidebar-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            여행 일정
                        </h2>
                        <div class="planner__date-picker">
                            <label for="travel-date" style="font-size: 0.875rem; color: var(--color-gray);">날짜:</label>
                            <input type="date" id="travel-date" class="planner__date-input">
                        </div>
                    </div>

                    <div class="planner__timeline-items" id="timeline-items">
                        <!-- Timeline items will be rendered here -->
                    </div>

                    <div class="planner__empty" id="timeline-empty">
                        <div class="planner__empty-icon">📅</div>
                        <p>아직 일정이 없습니다</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">왼쪽에서 장소를 드래그하거나 클릭하여 추가하세요</p>
                    </div>

                    <!-- Actions -->
                    <div style="display: flex; gap: 1rem; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--color-secondary);"
                        id="timeline-actions">
                        <button class="btn btn-primary" id="save-plan">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                                <polyline points="17 21 17 13 7 13 7 21" />
                                <polyline points="7 3 7 8 15 8" />
                            </svg>
                            일정 저장
                        </button>
                        <button class="btn btn-secondary" id="share-plan">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="18" cy="5" r="3" />
                                <circle cx="6" cy="12" r="3" />
                                <circle cx="18" cy="19" r="3" />
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                            </svg>
                            공유하기
                        </button>
                        <button class="btn btn-glass" id="clear-plan" style="margin-left: auto;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="3 6 5 6 21 6" />
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                            초기화
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/planner.js"></script>
    <script>
        // Check login state
        function checkAuth() {
            const user = localStorage.getItem('teumsae_user') || sessionStorage.getItem('teumsae_user');
            if (!user) {
                // Allow guest for now
                return { isGuest: true };
            }
            return JSON.parse(user);
        }

        // Update user info in header
        function updateUserInfo(user) {
            const avatar = document.getElementById('user-avatar');
            const name = document.getElementById('user-name');
            if (!avatar || !name) return;

            if (user.isGuest) {
                avatar.textContent = 'G';
                name.textContent = 'Guest';
            } else {
                const initial = user.email ? user.email.charAt(0).toUpperCase() : 'U';
                avatar.textContent = initial;
                name.textContent = user.name || user.email.split('@')[0];
            }
        }

        function logout() {
            localStorage.removeItem('teumsae_user');
            sessionStorage.removeItem('teumsae_user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = checkAuth();
            if (user) {
                updateUserInfo(user);
            }

            // Add scroll listener for header
            const header = document.querySelector('.header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });
    </script>
</body>

</html>
